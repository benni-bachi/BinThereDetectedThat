name: Publish sanitized collection snapshot
on:
  repository_dispatch:
    types: [collection-snapshot]
  push:
    branches: [main]
    paths: ['index.html', 'styles.css', 'app.js', 'data/records.json', '.github/workflows/collection-snapshot.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: collection-snapshot
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Check snapshot validator
        run: python3 -m unittest discover -s scripts -p test_import_snapshot.py
      - name: Validate public snapshot
        if: github.event_name == 'repository_dispatch'
        run: python3 scripts/import_snapshot.py
      - name: Commit validated data
        if: github.event_name == 'repository_dispatch'
        run: |
          if git diff --quiet -- data/records.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/records.json
          git commit -m "Update sanitized collection snapshot"
          git push
      # GITHUB_TOKEN commits do not trigger a separate Pages build; deploy explicitly.
      - name: Prepare public website files
        run: |
          mkdir -p _site/data
          cp index.html styles.css app.js _site/
          cp data/records.json _site/data/
      - name: Upload static website
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
  deploy:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
